[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "1.0.1"
description = "Free local tool that turns long videos into captioned YouTube Shorts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pedro" }]
license = "MIT"
dependencies = [
  "faster-whisper>=1.0.0",
  "yt-dlp>=2024.8.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.8.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
clip = "clipper.cli:main"
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipper = [
  "data/*",
  "static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
