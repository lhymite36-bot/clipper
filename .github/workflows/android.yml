name: Android APK

on:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'scripts/render_android_sample.py'
      - 'src/clipper/data/*.ttf'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Pipeline unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :pipeline:test

  build:
    runs-on: ubuntu-latest
    needs: test-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "No signing secret: the APK will be signed with a debug key."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify and rename
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Clipper-1.2.0.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "out/Clipper-1.2.0.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging "out/Clipper-1.2.0.apk" | grep -E "package:|sdkVersion|application-label:" || true
          (cd out && sha256sum *.apk | tee SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: Clipper-android-apk
          path: out/*
          if-no-files-found: error

      - name: Publish prerelease on android-v* tags
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          files: |
            out/Clipper-1.2.0.apk
            out/SHA256SUMS.txt
          body: |
            Clipper for Android (pre-release). Same v1.1.0 clipping + v1.2.0 Movie Recap, plus Auto-find so the app can pull videos by itself.

            Install `Clipper-1.2.0.apk` on a 64-bit phone (Samsung Galaxy A05 and similar). Open Settings to add optional API keys (they stay on the device). Clips land in the draft-only review queue; nothing posts unless Autopilot is on.

            This release is a prerelease and must not be marked Latest.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
