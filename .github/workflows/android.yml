name: Android APK

on:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'scripts/render_android_sample.py'
      - 'src/clipper/data/*.ttf'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Pipeline unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :pipeline:test

  build:
    runs-on: ubuntu-latest
    needs: test-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "::error::Release tags must be signed with the fixed Clipper key (ANDROID_KEYSTORE_BASE64 secret missing)."
            exit 1
          else
            echo "No signing secret: the APK will be signed with a debug key."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify and rename
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts | cut -d'"' -f2)
          echo "APK_NAME=Clipper-$VERSION.apk" >> "$GITHUB_ENV"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Clipper-$VERSION.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "out/Clipper-$VERSION.apk" | tee certs.txt
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            # Fixed release key: every update installs over the previous one.
            grep -qi "SHA-256 digest: 76ac7cff8429f17c7773711e19003f431cca92c46f45c7c130ba4664ac277921" certs.txt \
              || { echo "::error::APK is not signed with the fixed Clipper release key"; exit 1; }
          fi
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging "out/Clipper-$VERSION.apk" | grep -E "package:|sdkVersion|application-label:" || true
          (cd out && sha256sum *.apk | tee SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: Clipper-android-apk
          path: out/*
          if-no-files-found: error

      - name: Publish prerelease on android-v* tags
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          files: |
            out/${{ env.APK_NAME }}
            out/SHA256SUMS.txt
          body: |
            Clipper for Android (pre-release). This release must not be marked Latest.

            **1.2.2** = 1.2.1 + a permanent signing key, so future updates install without uninstalling.

            **1.2.1 fixes "I paste a URL and nothing happens".**
            - Downloads now try several routes in order: YouTube's own app API from your phone, then public Piped servers, then Invidious servers (server lists refresh automatically).
            - Accepts every common link: youtube.com/watch, m.youtube.com, youtu.be, /shorts/, /live/, music.youtube.com, links with ?si= and share text around them.
            - A live status card under the button shows each step, a progress bar, and a clear error if something fails, with Show log / Copy log. The notification shows progress too, and a final "Clip ready" or error message.
            - A failed download no longer crashes or closes the app.

            Install `${{ env.APK_NAME }}` on a 64-bit phone (Samsung Galaxy A05 and similar). Signed with Clipper's permanent release key (SHA-256 76:AC:7C:FF:…:27:79:21). Coming from 1.2.0 or 1.2.1, uninstall the old Clipper once first; from 1.2.2 on, updates install straight over the top. Allow notifications when asked. Clips land in the draft-only review queue; nothing posts unless Autopilot is on.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
